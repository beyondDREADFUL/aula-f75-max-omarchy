# AULA F75 Max: follow the Omarchy theme accent.
#
# The theme accent (or a colour from [theme_overrides]) becomes the colour of the
# lighting effect on all 80 keys, over the USB cable or the 2.4 GHz dongle.  The
# keyboard's firmware applies its own white balance, so colours are sent as chosen.

[color]
# "theme" follows the active Omarchy theme; "fixed" always uses fixed_color.
mode = "theme"

# Used only when mode = "fixed".  Goes through the automatic choice below, like
# a theme accent.
fixed_color = "#F34820"

# The automatic choice for an accent without an entry in [theme_overrides]
# (also for fixed_color and for --color without --exact):
#   - saturated accents (saturation 0.80 or more) are kept;
#   - muted accents keep their hue, with saturation lifted to
#     saturation_floor + saturation_gain x their saturation, at most 0.95;
#   - grey and pale accents (such as cream) become a soft white;
#   - lightness is held between min_lightness and max_lightness.  Keys read
#     lighter than the monitor swatch, so the upper bound sits a little below it.
saturation_floor = 0.55
saturation_gain = 0.5
max_lightness = 0.54
min_lightness = 0.46

[device]
# When the cable and the dongle are both plugged in, "auto" and "wired" use the
# cable.  Set "wireless" if the cable is only charging while you type on 2.4 GHz.
prefer = "auto"

[lighting]
# The effect shown in the accent colour.  Any of: static, single-on, single-off,
# glittering, falling, colourful, breath, spectrum, outward, scrolling, rolling,
# rotating, explode, launch, ripples, flowing, pulsating, tilt, shuttle.
# (See them with `f75ctl demo`; not every effect has been checked with a colour.)
effect = "static"

# Effect speed 0-5 and direction 0 or 1.  Static ignores both.
speed = 3
direction = 0

# Brightness 1-5 used until a level is known.  Over the cable the level you set
# with the keyboard's own keys is read back and kept on every apply; over the
# dongle the last applied level is reused (the dongle has no read-back).
default_brightness = 5

[lcd]
# Set the LCD clock to the system time on every apply over the cable (theme
# change, login, plugging in).  The dongle can't set it.
clock = true

[theme_overrides]
# An entry pins a colour to a theme slug and is used as written, bypassing the
# automatic choice above.  The bundled Omarchy themes are listed so their colours
# stay fixed; the values were chosen and checked on the keys.  Add a line for any
# other theme, or change one to taste; delete a line to use the automatic choice.
# Bundled Omarchy themes
catppuccin = "#1E70F5"  # accent #89b4fa, hue kept
catppuccin-latte = "#1E66F5"  # accent #1e66f5, hue kept
ethereal = "#2934EA"  # accent #7d82d9, hue kept
everforest = "#37DCC6"  # accent #7fbbb3, hue kept
flexoki-light = "#0D6EDE"  # accent #205EA6, hue kept
gruvbox = "#7FCB1E"  # folder green from the theme UI; the accent is aqua
hackerman = "#1CF84B"  # accent #82FB9C, hue kept
kanagawa = "#2B4FC9"  # indigo wave; the accent is cream
last-horizon = "#D64831"  # accent #b59790, hue kept
lumon = "#20A9F4"  # accent #8bc9eb, hue kept
lupine = "#295DEA"  # accent #3264eb, hue kept
matte-black = "#E6720A"  # accent #e68e0d, hue kept
miasma = "#A8A61F"  # accent #78824b, hue kept
nord = "#358ADE"  # accent #81a1c1, hue kept
osaka-jade = "#23C77D"  # accent #509475, hue kept
retro-82 = "#F76316"  # accent #faa968, hue kept
ristretto = "#ED421F"  # accent #f38d70, hue kept
rose-pine = "#25B6D0"  # accent #56949f, hue kept
solitude = "#D6DDE3"  # soft white; the accent is grey
tokyo-night = "#2264F2"  # accent #7aa2f7, hue kept
vantablack = "#DCE2E8"  # soft white; the accent is grey
white = "#E6E1D8"  # soft white; the accent is grey

# Not bundled: the accent is grey, so the colour comes from the wallpaper.
fireside = "#F26018"  # campfire orange; the accent is grey
